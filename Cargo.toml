[workspace]
members = [
  "crates/core-domain",
  "crates/metering",
  "crates/plugin-registry",
  "crates/plugin-sdk",
  "crates/protocol-anthropic",
  "crates/protocol-gemini",
  "crates/protocol-ir",
  "crates/protocol-realtime",
  "crates/provider-anthropic",
  "crates/provider-bedrock",
  "crates/provider-gateway",
  "crates/provider-gemini",
  "crates/provider-traits",
  "crates/routing-engine",
  "crates/runtime-composition",
  "services/audit-worker",
  "services/control-plane-api",
  "services/edge-probe",
  "services/gateway-api",
  "services/ledger-worker",
  "services/notification-worker",
  "services/realtime-gateway",
  "services/route-receipt-worker",
  "services/routing-worker",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/example/huge-router"
rust-version = "1.94.1"
version = "0.1.0"

[workspace.dependencies]
anyhow = { version = "1.0.102" }
aws-config = { version = "1.8.16" }
aws-sdk-bedrockruntime = { version = "1.130.0" }
axum = { version = "0.8.9" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
schemars = { version = "0.8.22", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
sha2 = { version = "0.10.9" }
thiserror = { version = "2.0.18" }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "5.4.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
nursery = "warn"
pedantic = "warn"
