name: huge-router-local

services:
  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huge_router}
      POSTGRES_USER: ${POSTGRES_USER:-huge_router}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huge_router}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.6.2
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  nats:
    image: nats:2.12.7-alpine3.22
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz | grep ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - nats-data:/data

  control-plane-api:
    profiles: ["runtime"]
    build:
      context: ../..
      dockerfile: Dockerfile.rust-service
      args:
        SERVICE_NAME: control-plane-api
        BIN_NAME: control-plane-api
    environment:
      CONTROL_PLANE_API_ADDR: 0.0.0.0:8081
      CONTROL_PLANE_DATABASE_URL: postgres://${POSTGRES_USER:-huge_router}:${POSTGRES_PASSWORD:-huge_router}@postgres:5432/${POSTGRES_DB:-huge_router}
      CONTROL_PLANE_INTERNAL_TOKEN: ${CONTROL_PLANE_INTERNAL_TOKEN:-change-me}
      CONSOLE_WEB_BASE_URL: ${CONSOLE_WEB_BASE_URL:-http://127.0.0.1:3000}
      CONTROL_PLANE_ALLOW_MOCK_AUTH: ${CONTROL_PLANE_ALLOW_MOCK_AUTH:-false}
      CONTROL_PLANE_AUTH_EMAIL_ENABLED: ${CONTROL_PLANE_AUTH_EMAIL_ENABLED:-true}
      CONTROL_PLANE_AUTH_GITHUB_ENABLED: ${CONTROL_PLANE_AUTH_GITHUB_ENABLED:-false}
      CONTROL_PLANE_AUTH_GOOGLE_ENABLED: ${CONTROL_PLANE_AUTH_GOOGLE_ENABLED:-false}
      CONTROL_PLANE_AUTH_WECHAT_ENABLED: ${CONTROL_PLANE_AUTH_WECHAT_ENABLED:-false}
      CONTROL_PLANE_OAUTH_GITHUB_CLIENT_ID: ${CONTROL_PLANE_OAUTH_GITHUB_CLIENT_ID:-}
      CONTROL_PLANE_OAUTH_GITHUB_CLIENT_SECRET: ${CONTROL_PLANE_OAUTH_GITHUB_CLIENT_SECRET:-}
      CONTROL_PLANE_OAUTH_GITHUB_REDIRECT_URI: ${CONTROL_PLANE_OAUTH_GITHUB_REDIRECT_URI:-}
      CONTROL_PLANE_OAUTH_GITHUB_SCOPE: ${CONTROL_PLANE_OAUTH_GITHUB_SCOPE:-read:user user:email}
      CONTROL_PLANE_OAUTH_GOOGLE_CLIENT_ID: ${CONTROL_PLANE_OAUTH_GOOGLE_CLIENT_ID:-}
      CONTROL_PLANE_OAUTH_GOOGLE_CLIENT_SECRET: ${CONTROL_PLANE_OAUTH_GOOGLE_CLIENT_SECRET:-}
      CONTROL_PLANE_OAUTH_GOOGLE_REDIRECT_URI: ${CONTROL_PLANE_OAUTH_GOOGLE_REDIRECT_URI:-}
      CONTROL_PLANE_OAUTH_GOOGLE_SCOPE: ${CONTROL_PLANE_OAUTH_GOOGLE_SCOPE:-openid email profile}
      CONTROL_PLANE_OAUTH_WECHAT_CLIENT_ID: ${CONTROL_PLANE_OAUTH_WECHAT_CLIENT_ID:-}
      CONTROL_PLANE_OAUTH_WECHAT_CLIENT_SECRET: ${CONTROL_PLANE_OAUTH_WECHAT_CLIENT_SECRET:-}
      CONTROL_PLANE_OAUTH_WECHAT_REDIRECT_URI: ${CONTROL_PLANE_OAUTH_WECHAT_REDIRECT_URI:-}
      CONTROL_PLANE_OAUTH_WECHAT_SCOPE: ${CONTROL_PLANE_OAUTH_WECHAT_SCOPE:-snsapi_login}
      CONTROL_PLANE_OIDC_AUTHORIZATION_URL: ${CONTROL_PLANE_OIDC_AUTHORIZATION_URL:-}
      CONTROL_PLANE_OIDC_TOKEN_URL: ${CONTROL_PLANE_OIDC_TOKEN_URL:-}
      CONTROL_PLANE_OIDC_USERINFO_URL: ${CONTROL_PLANE_OIDC_USERINFO_URL:-}
      CONTROL_PLANE_OIDC_CLIENT_ID: ${CONTROL_PLANE_OIDC_CLIENT_ID:-}
      CONTROL_PLANE_OIDC_CLIENT_SECRET: ${CONTROL_PLANE_OIDC_CLIENT_SECRET:-}
      CONTROL_PLANE_OIDC_REDIRECT_URI: ${CONTROL_PLANE_OIDC_REDIRECT_URI:-}
      CONTROL_PLANE_OIDC_GROUP_ROLE_MAP: ${CONTROL_PLANE_OIDC_GROUP_ROLE_MAP:-}
      CONTROL_PLANE_OIDC_PLATFORM_ADMIN_GROUPS: ${CONTROL_PLANE_OIDC_PLATFORM_ADMIN_GROUPS:-platform-admins}
      CLIENT_BROWSER_PROXY_TOKEN: ${CLIENT_BROWSER_PROXY_TOKEN:-}
      CLIENT_BROWSER_PROXY_SCHEME: ${CLIENT_BROWSER_PROXY_SCHEME:-socks5}
      CLIENT_BROWSER_PROXY_HOST: ${CLIENT_BROWSER_PROXY_HOST:-}
      CLIENT_BROWSER_PROXY_PORT: ${CLIENT_BROWSER_PROXY_PORT:-}
      CLIENT_BROWSER_PROXY_USERNAME: ${CLIENT_BROWSER_PROXY_USERNAME:-}
      CLIENT_BROWSER_PROXY_PASSWORD: ${CLIENT_BROWSER_PROXY_PASSWORD:-}
      CLIENT_BROWSER_PROXY_CONNECT_HOST: ${CLIENT_BROWSER_PROXY_CONNECT_HOST:-}
      CLIENT_BROWSER_PROXY_BYPASS_RULES: ${CLIENT_BROWSER_PROXY_BYPASS_RULES:-<local>;localhost;127.0.0.1;::1}
      RUST_LOG: ${CONTROL_PLANE_RUST_LOG:-info}
    ports:
      - "${CONTROL_PLANE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway-api:
    profiles: ["runtime"]
    build:
      context: ../..
      dockerfile: Dockerfile.rust-service
      args:
        SERVICE_NAME: gateway-api
        BIN_NAME: gateway-api
    environment:
      GATEWAY_API_ADDR: 0.0.0.0:8080
      CONTROL_PLANE_BASE_URL: http://control-plane-api:8081
      CONTROL_PLANE_INTERNAL_TOKEN: ${CONTROL_PLANE_INTERNAL_TOKEN:-change-me}
      GATEWAY_NATS_URL: nats://nats:4222
      GATEWAY_OPENAI_API_KEY: ${GATEWAY_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      GATEWAY_ANTHROPIC_API_KEY: ${GATEWAY_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}
      GATEWAY_GEMINI_API_KEY: ${GATEWAY_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      GATEWAY_OPENAI_MODEL: ${GATEWAY_OPENAI_MODEL:-gpt-4.1-mini}
      GATEWAY_ANTHROPIC_MODEL: ${GATEWAY_ANTHROPIC_MODEL:-claude-3-opus}
      GATEWAY_GEMINI_MODEL: ${GATEWAY_GEMINI_MODEL:-gemini-1.5-pro}
      RUST_LOG: ${GATEWAY_RUST_LOG:-info}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      nats:
        condition: service_healthy
      control-plane-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ledger-worker:
    profiles: ["runtime"]
    build:
      context: ../..
      dockerfile: Dockerfile.rust-service
      args:
        SERVICE_NAME: ledger-worker
        BIN_NAME: ledger-worker
    environment:
      LEDGER_WORKER_DATABASE_URL: postgres://${POSTGRES_USER:-huge_router}:${POSTGRES_PASSWORD:-huge_router}@postgres:5432/${POSTGRES_DB:-huge_router}
      LEDGER_WORKER_NATS_URL: nats://nats:4222
      RUST_LOG: ${LEDGER_WORKER_RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  route-receipt-worker:
    profiles: ["runtime"]
    build:
      context: ../..
      dockerfile: Dockerfile.rust-service
      args:
        SERVICE_NAME: route-receipt-worker
        BIN_NAME: route-receipt-worker
    environment:
      ROUTE_RECEIPT_WORKER_DATABASE_URL: postgres://${POSTGRES_USER:-huge_router}:${POSTGRES_PASSWORD:-huge_router}@postgres:5432/${POSTGRES_DB:-huge_router}
      ROUTE_RECEIPT_WORKER_NATS_URL: nats://nats:4222
      RUST_LOG: ${ROUTE_RECEIPT_WORKER_RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  routing-worker:
    profiles: ["runtime"]
    build:
      context: ../..
      dockerfile: Dockerfile.rust-service
      args:
        SERVICE_NAME: routing-worker
        BIN_NAME: routing-worker
    environment:
      ROUTING_WORKER_DATABASE_URL: postgres://${POSTGRES_USER:-huge_router}:${POSTGRES_PASSWORD:-huge_router}@postgres:5432/${POSTGRES_DB:-huge_router}
      ROUTING_WORKER_NATS_URL: nats://nats:4222
      ROUTING_WORKER_QUARANTINE_THRESHOLD: ${ROUTING_WORKER_QUARANTINE_THRESHOLD:-3}
      RUST_LOG: ${ROUTING_WORKER_RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  edge-probe:
    profiles: ["runtime"]
    build:
      context: ../..
      dockerfile: Dockerfile.rust-service
      args:
        SERVICE_NAME: edge-probe
        BIN_NAME: edge-probe
    environment:
      EDGE_PROBE_NATS_URL: nats://nats:4222
      EDGE_PROBE_TARGET_URL: ${EDGE_PROBE_TARGET_URL:-http://gateway-api:8080/healthz}
      EDGE_PROBE_PROVIDER_RESOURCE_ID: ${EDGE_PROBE_PROVIDER_RESOURCE_ID:-prvrsrc_openai_primary}
      EDGE_PROBE_PROBE_MODE: ${EDGE_PROBE_PROBE_MODE:-cheap_health}
      EDGE_PROBE_INTERVAL_MS: ${EDGE_PROBE_INTERVAL_MS:-30000}
      EDGE_PROBE_TIMEOUT_MS: ${EDGE_PROBE_TIMEOUT_MS:-2000}
      EDGE_PROBE_DEGRADED_LATENCY_MS: ${EDGE_PROBE_DEGRADED_LATENCY_MS:-1500}
      RUST_LOG: ${EDGE_PROBE_RUST_LOG:-info}
    depends_on:
      nats:
        condition: service_healthy
      gateway-api:
        condition: service_healthy
    restart: unless-stopped

  audit-worker:
    profiles: ["runtime"]
    build:
      context: ../..
      dockerfile: Dockerfile.rust-service
      args:
        SERVICE_NAME: audit-worker
        BIN_NAME: audit-worker
    environment:
      AUDIT_WORKER_DATABASE_URL: postgres://${POSTGRES_USER:-huge_router}:${POSTGRES_PASSWORD:-huge_router}@postgres:5432/${POSTGRES_DB:-huge_router}
      AUDIT_WORKER_NATS_URL: nats://nats:4222
      RUST_LOG: ${AUDIT_WORKER_RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    profiles: ["runtime"]
    build:
      context: ../..
      dockerfile: Dockerfile.rust-service
      args:
        SERVICE_NAME: notification-worker
        BIN_NAME: notification-worker
    environment:
      NOTIFICATION_WORKER_DATABASE_URL: postgres://${POSTGRES_USER:-huge_router}:${POSTGRES_PASSWORD:-huge_router}@postgres:5432/${POSTGRES_DB:-huge_router}
      NOTIFICATION_WORKER_NATS_URL: nats://nats:4222
      RUST_LOG: ${NOTIFICATION_WORKER_RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "9464:9464"
      - "13133:13133"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:13133/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.11.2
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.29.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:13.0.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - grafana-data:/var/lib/grafana

# Optional ClickHouse is intentionally deferred until analytics scale requires it.
volumes:
  alertmanager-data:
  grafana-data:
  nats-data:
  postgres-data:
  prometheus-data:
  redis-data:
