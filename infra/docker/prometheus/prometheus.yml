global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:9464']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
