name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify quality gates
        run: |
          pnpm test
          pnpm build
          cargo test --workspace --locked

      - name: Validate compose topology
        run: docker compose -f infra/docker/compose.yaml --profile runtime --profile observability config -q

      - name: Build runtime service images
        run: >-
          docker compose -f infra/docker/compose.yaml --profile runtime build
          control-plane-api
          gateway-api
          ledger-worker
          route-receipt-worker
          routing-worker
          edge-probe
          audit-worker
          notification-worker

      - name: Container smoke
        env:
          SMOKE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          SMOKE_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          SMOKE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
        run: |
          if [ -z "${SMOKE_OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY not configured; skipping container smoke."
            exit 0
          fi
          chmod +x infra/scripts/*.sh infra/scripts/lib/*.sh
          ./infra/scripts/smoke.sh

      - name: Generate changelog
        run: node ./scripts/generate-changelog.mjs > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
