name: Technical task
description: Track scoped implementation, refactor, or quality work.
title: "[task]: "
labels: ["task", "needs-triage"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What exact files, packages, or behavior are in scope?
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What should this task intentionally avoid?
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Which local and CI checks should prove this is done?
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary checks
      options:
        - label: This task avoids unrelated formatting churn.
        - label: This task does not mix generated contract changes with unrelated refactors.
        - label: This task identifies owner paths or high-contention files.
