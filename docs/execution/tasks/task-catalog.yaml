  - id: MET-005
    title: Implement billing and usage analytics endpoints
    stream: Metering, Ledger, and Billing
    phase: PI-3
    deps:
      - MET-004
      - CTL-001
    owners:
      - billing-platform
      - control-plane
    size: M
    paths:
