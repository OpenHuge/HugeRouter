      - logout and session expiry are handled cleanly
      - role mapping is configurable
  - id: SEC-003
    title: Implement secret reference model and provider credential storage boundary
    stream: Security, Identity, and Compliance
    phase: PI-1
    deps:
      - FND-004
      - DB-001
    owners:
      - security
      - control-plane
    size: M
    paths:
      - crates/storage
      - services/control-plane-api
      - crates/config
