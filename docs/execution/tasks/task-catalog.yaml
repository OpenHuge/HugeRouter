      - secret references can be resolved by authorized services only
      - rotation is auditable
  - id: SEC-004
    title: Build audit event pipeline and retention controls
    stream: Security, Identity, and Compliance
    phase: PI-2
    deps:
      - DB-002
      - SEC-001
      - OBS-001
    owners:
      - security
      - data-platform
    size: M
    paths:
      - services/audit-worker
      - crates/queue
      - crates/storage
