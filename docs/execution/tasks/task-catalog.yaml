      - audit queries are filterable by actor and resource
      - retention policies are testable
  - id: OBS-001
    title: Implement telemetry crate and platform-wide OpenTelemetry conventions
    stream: Observability, SRE, and Runtime
    phase: PI-0
    deps:
      - FND-001
      - FND-003
    owners:
