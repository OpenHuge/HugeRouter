  - id: SEC-001
    title: Define RBAC model, scopes, and authorization middleware
    stream: Security, Identity, and Compliance
    phase: PI-0
    deps:
      - FND-001
      - CTL-001
    owners:
      - security
    size: M
    paths:
      - crates/authn-authz
      - services/control-plane-api
      - services/gateway-api
    outputs:
      - role model
      - scope evaluation
      - authorization middleware
    accepts:
      - tenant and platform scopes are distinct
      - forbidden responses are normalized
      - authorization decisions are traceable
  - id: SEC-002
    title: Implement OIDC/SSO login flow for console users
    stream: Security, Identity, and Compliance
    phase: PI-3
    deps:
      - CTL-004
      - SEC-001
    owners:
      - security
      - frontend-console
    size: M
    paths:
      - apps/console-web
      - services/control-plane-api
      - crates/authn-authz
